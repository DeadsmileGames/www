name: Website verification

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - "vercel.json"
      - "render.yaml"
      - ".github/workflows/website-verification.yml"
      - ".github/workflows/vendor-comic-neue.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - "vercel.json"
      - "render.yaml"
      - ".github/workflows/website-verification.yml"
      - ".github/workflows/vendor-comic-neue.yml"

permissions:
  contents: read

concurrency:
  group: website-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
